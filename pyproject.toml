[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosched"
version = "0.1.0"
description = "A Carbon-Aware Workload Orchestrator and Simulation Framework for Geo-Distributed Heterogeneous Compute Clusters"
readme = "README.md"
authors = [
    { name = "Durgesh Kanjariya", email = "durgeshkanjariya10@gmail.com" }
]
license = { text = "MIT" }
keywords = ["green computing", "carbon-aware", "distributed systems", "cloud computing", "scheduling", "discrete event simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "tabulate>=0.9.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
